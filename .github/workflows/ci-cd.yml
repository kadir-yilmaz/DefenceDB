name: DefenceDB CI/CD (WebDeploy)

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Deploy WebUI
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Create appsettings.json from Secrets
        shell: pwsh
        run: |
          $appsettings = @'
          ${{ secrets.APPSETTINGS_JSON }}
          '@
          if (-not [string]::IsNullOrWhiteSpace($appsettings.Trim())) {
              $appsettings | Out-File -FilePath "DefenceDB.WebUI/appsettings.json" -Encoding utf8
              Write-Host "Successfully created DefenceDB.WebUI/appsettings.json from APPSETTINGS_JSON secret."
          } else {
              Write-Error "APPSETTINGS_JSON secret is missing or empty!"
              exit 1
          }

      - name: Inject COMMIT_SHA into appsettings.json
        shell: pwsh
        run: |
          $json = Get-Content -Path "DefenceDB.WebUI/appsettings.json" -Raw | ConvertFrom-Json
          $json | Add-Member -NotePropertyName "COMMIT_SHA" -NotePropertyValue "${{ github.sha }}" -Force
          $json | ConvertTo-Json -Depth 10 | Out-File -FilePath "DefenceDB.WebUI/appsettings.json" -Encoding utf8
          Write-Host "Injected COMMIT_SHA (${{ github.sha }}) into appsettings.json"

      - name: Deploy WebUI via WebDeploy
        shell: pwsh
        run: |
          $rawJson = @'
          ${{ secrets.DEPLOY_SECRETS_JSON }}
          '@

          if ([string]::IsNullOrWhiteSpace($rawJson.Trim())) {
              Write-Error "DEPLOY_SECRETS_JSON secret is missing or empty!"
              exit 1
          }

          try {
              $deployObj = $rawJson | ConvertFrom-Json
          } catch {
              Write-Error "Failed to parse DEPLOY_SECRETS_JSON secret as valid JSON!"
              exit 1
          }

          $server   = $deployObj.Server
          $site     = $deployObj.Site
          $username = $deployObj.Username
          $password = $deployObj.Password

          if ([string]::IsNullOrWhiteSpace($server) -or [string]::IsNullOrWhiteSpace($site) -or [string]::IsNullOrWhiteSpace($username) -or [string]::IsNullOrWhiteSpace($password)) {
              Write-Error "DEPLOY_SECRETS_JSON must contain Server, Site, Username, and Password fields!"
              exit 1
          }

          Write-Host "Publishing and Deploying DefenceDB to $site..."

          dotnet publish DefenceDB.WebUI -c Release `
            "/p:SourceRevisionId=${{ github.sha }}" `
            "/p:WebPublishMethod=MSDeploy" `
            "/p:MSDeployPublishMethod=WMSVC" `
            "/p:MsDeployServiceUrl=$server" `
            "/p:DeployIisAppPath=$site" `
            "/p:UserName=$username" `
            "/p:Password=$password" `
            "/p:AuthType=Basic" `
            "/p:AllowUntrustedCertificate=true" `
            "/p:EnableMSDeployAppOffline=true" `
            "/p:UseChecksum=true" `
            "/p:MSDeployVerbosity=Detailed" `
            "/p:RetryAttempts=3" `
            "/p:RetryInterval=2000" `
            "/p:SkipExtraFilesOnServer=true"
