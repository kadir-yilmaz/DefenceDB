name: DefenceDB CI/CD (WebDeploy)

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create appsettings.json from Secrets
        shell: powershell
        run: |
          $json = @"
          ${{ secrets.APPSETTINGS_JSON }}
          "@
          if (-not [string]::IsNullOrWhiteSpace($json.Trim())) {
              Set-Content -Path "DefenceDB.WebUI/appsettings.json" -Value $json -Encoding UTF8
              Write-Host "Successfully created DefenceDB.WebUI/appsettings.json from APPSETTINGS_JSON secret."
          } else {
              Write-Error "APPSETTINGS_JSON secret is missing or empty!"
              exit 1
          }

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      - name: Deploy via WebDeploy (MonsterASP / siteasp.net)
        shell: powershell
        run: |
          $rawJson = @"
          ${{ secrets.DEPLOY_SECRETS_JSON }}
          "@

          if ([string]::IsNullOrWhiteSpace($rawJson.Trim())) {
              Write-Error "DEPLOY_SECRETS_JSON secret is missing or empty!"
              exit 1
          }

          try {
              $deployObj = $rawJson | ConvertFrom-Json
          } catch {
              Write-Error "Failed to parse DEPLOY_SECRETS_JSON secret as valid JSON!"
              exit 1
          }

          $server   = $deployObj.Server
          $site     = $deployObj.Site
          $username = $deployObj.Username
          $password = $deployObj.Password

          if ([string]::IsNullOrWhiteSpace($server) -or [string]::IsNullOrWhiteSpace($site) -or [string]::IsNullOrWhiteSpace($username) -or [string]::IsNullOrWhiteSpace($password)) {
              Write-Error "DEPLOY_SECRETS_JSON must contain Server, Site, Username, and Password fields!"
              exit 1
          }

          Write-Host "Publishing & Deploying via WebDeploy to $site ($server)..."

          dotnet publish DefenceDB.WebUI/DefenceDB.WebUI.csproj `
            -c Release `
            /p:DeployOnBuild=true `
            /p:PublishProvider=WebDeploy `
            /p:PublishUrl=$server `
            /p:DeployIisAppPath=$site `
            /p:UserName=$username `
            /p:Password=$password `
            /p:AllowUntrusted=True `
            /p:AuthType=Basic `
            /p:SkipExtraFilesOnServer=True `
            /p:MSDeploySkipExtraFilesOnServer=True
